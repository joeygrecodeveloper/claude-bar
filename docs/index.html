  <title>claude-bar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;

      flex-direction: column;

      justify-content: center;

    .card {
      background: #ffffff;
      border-radius: 20px;

      max-width: 560px;
      width: 100%;

      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);

      font-weight: 600;
      letter-spacing: -0.5px;
      color: #1d1d1f;
    }

      margin-top: 10px;
      font-size: 17px;
      color: #6e6e73;
      line-height: 1.5;
    }

    .screenshot-wrap {
      margin: 36px auto 0;
      max-width: 420px;
    }

    .screenshot-wrap img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      display: block;
    }

    .link-row {
      margin-top: 36px;
    }

    .link-row a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
      color: #0066cc;
      text-decoration: none;
    }

    .link-row a:hover {
      text-decoration: underline;
    }

    .link-row a svg {
      flex-shrink: 0;
    }

    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #aeaeb2;
    }
  </style>
</head>
